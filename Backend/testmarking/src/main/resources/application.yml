spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:omr_db}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:your-email@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:your-gmail-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

application:
  security:
    jwt:
      access-token:
        secret-key: ${JWT_SECRET}
        expiration: 86400000          # 1 day in milliseconds
      refresh-token:
        secret-key: ${JWT_REFRESH_SECRET}
        expiration: 604800000       # 7 days

demo:
  enabled: ${DEMO_ENABLED:false}

storage:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${RUSTFS_ACCESS_KEY}
  secret-key: ${RUSTFS_SECRET_KEY}
  buckets:
    raw: raw-image
    marked: marked-image
    avatar: avatar
    class-files: class-files

omr:
  template:
    # Reject layouts that are not the 20/40/60 preset rule. false = accept any 2- or 4-zone layout (NestJS behaviour).
    enforce-distribution: true
    default-status: PUBLISHED   # NestJS saved PUBLISHED; entity default is DRAFT
    default-type: STANDARD      # NestJS saved STANDARD; entity default is CUSTOM

